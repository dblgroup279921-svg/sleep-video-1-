name: Render Remotion Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # যদি আপনার কোড মূল রুট ডিরেক্টরিতে না থেকে কোনো সাব-ফোল্ডারে থাকে, তবে এই পাথটি দরকার হবে
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install # npm ci এর বদলে npm install ব্যবহার করা হয়েছে

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Render Video
        run: npm run render

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
